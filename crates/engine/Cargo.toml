[package]
name = "engine"
description = "Headless game engine for fnv-terminal-ai-game"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"

[[bench]]
name = "load"
harness = false

[dev-dependencies]
jsonschema = "0.60.1"
proptest = "1.12.0"

[[bench]]
name = "evaluate"
harness = false

[[bench]]
name = "quests"
harness = false

[[bench]]
name = "game"
harness = false

[[bench]]
name = "world"
harness = false

[[bench]]
name = "dialogue"
harness = false
