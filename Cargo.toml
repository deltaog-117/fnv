[workspace]
resolver = "3"
members = ["crates/engine", "crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["deltaog-117"]
publish = false

# Lints apply to every crate (each crate opts in with `[lints] workspace = true`).
# `unwrap` is denied outside tests (see clippy.toml); use `Result`, or `expect`
# with a message that explains why failure is impossible.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
dbg_macro = "deny"
